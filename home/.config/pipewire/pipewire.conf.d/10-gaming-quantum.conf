# A floor under the audio buffer: 512 samples (10.7 ms at 48 kHz).
#
# Games through Proton ask for 480 samples (10 ms), and PipeWire rounds a
# request down to a power of two -- so the sound card ran at 256 (5.3 ms),
# too little headroom for a scene heavy with effects: the audio thread missed
# its deadline (xruns, 50 of them in one Zenless session) and crackled. At
# 512 a busy frame no longer starves it, and 10 ms of latency is not heard.
context.properties = {
    default.clock.min-quantum = 512
}
