# Turn the panels off after ten minutes of no input.
#
# hypridle asks the compositor for idle time (ext-idle-notify) rather than
# watching input itself, so what counts as activity is whatever Hyprland
# counts: keyboard, pointer, touch. See the note on gamepads at the bottom,
# because that distinction is the one that bites.

general {
    # Video players and browsers take a dbus idle inhibit while something is
    # playing. Honouring it is the difference between watching a film and
    # watching a film with the screen going out every ten minutes.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 600

    # wlopm, and deliberately not hyprctl. Three things rule hyprctl out here,
    # each of which looked fine until it was actually tried:
    #
    # 1. `hyprctl dispatch dpms off DP-2` is a syntax error. This config is
    #    Lua, so hyprctl parses what follows as Lua, and the screens simply
    #    never go out -- with the failure landing ten minutes later, in a log
    #    nobody is reading.
    # 2. The Lua spelling is `hyprctl eval 'hl.dispatch(hl.dsp.dpms("off"))'`.
    #    The hl.dispatch wrapper is not optional: hl.dsp.* only *builds* a
    #    dispatcher, so `hl.dsp.dpms("off")` on its own answers "ok" and does
    #    nothing at all.
    # 3. Spelled correctly, that dispatcher ignores its argument and toggles.
    #    "off" and "on" do the same thing, and it takes every output with it,
    #    DP-1 -- Sunshine's virtual display -- included. In an on-timeout and
    #    on-resume pair that desynchronises on the first missed edge: one
    #    screen already off, and "turn off" turns it on.
    #
    # wlopm drives zwlr_output_power_manager_v1, which is per-output and takes
    # an explicit state rather than a toggle. So the two physical panels are
    # named here, a live stream on DP-1 is left alone -- screens off at the
    # desk, session still running for the phone -- and running it twice says
    # the same thing twice.
    #
    # There is no fallback for a machine without wlopm on purpose. The only
    # candidate was the toggle above, and a desynchronised toggle is worse
    # than nothing: this way it fails loudly in the log, with the screens in
    # the state you left them.
    on-timeout = wlopm --off HDMI-A-1 --off DP-2
    on-resume  = wlopm --on HDMI-A-1 --on DP-2
}

# Not wired here: locking.
#
# veila already owns that, through veila-idle.service (VEILA_IDLE_LOCK_AFTER,
# 300 by default) and Super + L. Giving hypridle a lock_cmd as well would mean
# two daemons deciding when the session locks, and the loser of that race is
# whichever one you later try to reason about. Screens off is all this does.

# The gamepad caveat.
#
# An Xbox-style controller is an evdev device, not a wl_seat input, so the
# compositor does not see it as activity: ten minutes into a controller-only
# session the screen goes out. gamepad-mode covers this by construction --
# it maps the pad onto a uinput keyboard and mouse, which Hyprland does count
# -- so a stream is fine. Playing natively with a pad and nothing else is the
# gap. `pkill hypridle` for that session, or raise the timeout.
