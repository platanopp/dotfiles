# Turn the panels off after fifteen minutes of no input.
#
# hypridle asks the compositor for idle time (ext-idle-notify) rather than
# watching input itself, so what counts as activity is whatever Hyprland
# counts: keyboard, pointer, touch. See the note on gamepads at the bottom,
# because that distinction is the one that bites.

general {
    # Video players and browsers take a dbus idle inhibit while something is
    # playing. Honouring it is the difference between watching a film and
    # watching a film with the screen going out every fifteen minutes.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false

    # Cover the screen before the machine goes down, whatever asked it to.
    #
    # The shell locks first when the suspend is its own -- the control panel's
    # button waits for the compositor to confirm the lock is up before calling
    # systemctl, see AppState.suspendSession(). Nothing else does: a bare
    # `systemctl suspend`, a lid, a power-key handler. Those come back to a
    # desktop that was never covered, which is the whole gap this closes.
    #
    # `loginctl lock-session` and not a locker: logind emits Lock on the
    # session object and the shell is listening for it, so the same one line
    # works no matter what draws the lock -- see the logind watcher in
    # LockEngine.qml.
    before_sleep_cmd = loginctl lock-session
}

# Screens off after a stretch of idle.
#
# The Samsung is powered off with DPMS; the Xiaomi is either switched off over
# DDC or covered in black, depending on XIAOMI_MODE -- see
# scripts/idle-screens.sh for why the two are treated differently.
#
# The timeouts in this file are set from the shell's Settings window (Power &
# idle), through scripts/idle_settings.py, which rewrites the two numbers and
# restarts hypridle. Editing them here by hand works just as well.
listener {
    timeout = 900
    on-timeout = ~/.config/hypr/scripts/idle-screens.sh off
    on-resume  = ~/.config/hypr/scripts/idle-screens.sh on
}

# Lock a while after the screens went off.
#
# hypridle times every listener from the last input, not one after the other,
# so this timeout is the screens-off one plus the delay. Kept as its own step
# rather than locking with the screens: a screen that has only just gone dark
# comes back with a key press, and having to type a password to read what was
# already on it is the kind of lock people end up switching off.
#
# `loginctl lock-session` and not the shell directly, for the same reason as
# before_sleep_cmd above: logind emits Lock on the session, and the lock
# screen is listening for that signal (see the logind watcher in
# LockEngine.qml).
listener {
    timeout = 1200
    on-timeout = loginctl lock-session
}

# Locking on idle is the second listener above. It was left out at first,
# on the grounds that twenty idle minutes at this desk tends to mean a video
# or a game -- but both of those keep it from firing anyway: a playing video
# holds an inhibit (see ignore_dbus_inhibit), and a game is played with input
# going on.

# The gamepad caveat.
#
# An Xbox-style controller is an evdev device, not a wl_seat input, so the
# compositor does not see it as activity: fifteen minutes into a controller-only
# session the screen goes out. gamepad-mode covers this by construction --
# it maps the pad onto a uinput keyboard and mouse, which Hyprland does count
# -- so a stream is fine. Playing natively with a pad and nothing else is the
# gap. `pkill hypridle` for that session, or raise the timeout.
