# ~/.config/kitty/effects.conf
# Efectos visuales: cursor con estela, animaciones suaves, tab bar prolija.
# Incluir en kitty.conf con: include effects.conf

# --- cursor con estela (trail) al moverse ---
cursor_shape                 beam
cursor_beam_thickness         2.5
cursor_blink_interval        0.5
cursor_stop_blinking_after   15.0
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2

# --- scroll y redibujado suaves ---
resize_draw_strategy         blank
resize_in_new_tab            yes
sync_to_monitor               yes

# --- tab bar estilo powerline, prolija ---
tab_bar_style                powerline
tab_powerline_style           slanted
tab_title_template            "{title}"

# --- ventana ---
window_padding_width          8
hide_window_decorations       yes
confirm_os_window_close       0

# --- URLs subrayadas al hover, en el color de acento ---
url_style                     curly
