# The kitty yazi runs in (Super+E, and any folder opened from another app):
# loaded after kitty.conf, with `-c kitty.conf -c yazi.conf`.
#
# Yazi is laid out after Dolphin (yazi/keymap.toml), and kitty's own
# shortcuts took several of Dolphin's keys before yazi saw them: Ctrl+Tab
# (next tab), Ctrl+Shift+N (new window), Ctrl+Shift+A, Ctrl+Shift+F, ...
# So this window keeps none of them but the few that still mean something
# in a file manager.
clear_all_shortcuts yes

# Pasting a name into rename or new-folder, and copying text off the screen.
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+c copy_to_clipboard

# Dolphin's zoom: bigger or smaller, and back to normal.
map ctrl+equal change_font_size current +1
map ctrl+plus  change_font_size current +1
map ctrl+minus change_font_size current -1
map ctrl+0     change_font_size current 0
