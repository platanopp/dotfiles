[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
show_hidden = false
show_symlink = true
# Size and date beside each name, like Dolphin's details view (init.lua).
linemode = "size_and_mtime"
# Keep a few rows of context above and below the cursor while scrolling.
scrolloff = 5
# Click to select, wheel to scroll, and drag -- the mouse as in Dolphin.
mouse_events = ["click", "scroll", "drag"]

[preview]
tab_size = 2
max_width = 1200
max_height = 900
cache_dir = ""
image_delay = 0
image_filter = "triangle"
image_quality = 75

[opener]
# Paths are substituted by yazi's own placeholders -- `%s` for every selected
# path, `%s1` for just the hovered one. The shell's `"$@"` looks like it
# should work and silently expands to nothing, which is how `nvim "$@"` used
# to open an empty editor instead of the file under the cursor.
edit = [
    # No `kitty -e` here: `block` already hands this terminal over to the
    # editor, so wrapping it opened a second window on top of the one yazi
    # is running in.
    { run = 'nvim %s', block = true, desc = "Editar en nvim", for = "unix" },
]
open = [
    { run = 'xdg-open %s1', desc = "Abrir", for = "unix" },
]
play-gif = [
    { run = 'mpv --loop %s', orphan = true, desc = "Reproducir gif animado" },
]
[plugin]
prepend_fetchers = [
    { url = "*", run = "git", group = "git" },
    { url = "*/", run = "git", group = "git" },
]
prepend_preloaders = [
    { mime = "{audio,video,image}/*", run = "mediainfo" },
]
[open]
prepend_rules = [
    { mime = "image/gif", use = ["play-gif", "open"] },
    # Enter on an archive extracts it here (yazi's own rule, for zip, rar,
    # 7z, tar and the compressed tars). Disc images and packages were only
    # previewed; 7-Zip opens those too, so they extract the same way.
    { mime = "application/{iso9660-image,cd-image,qemu-disk,ms-wim,apple-diskimage,debian*-package,redhat-package-manager,rpm,android.package-archive,java-archive}", use = ["extract", "reveal"] },
]
