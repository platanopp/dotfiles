# Only the additions and overrides live here; yazi's own defaults stay in
# force underneath. Every entry carries a `desc` because the shell's
# shortcut sheet reads this file and shows it.
#
# Laid out after Dolphin: the keys a KDE file manager answers to do the same
# here -- Ctrl+C / X / V, Delete, F2, Alt+arrows, Ctrl+L, Ctrl+H, Ctrl+T,
# F4, F9, F11 -- and the vim keys yazi ships with keep working alongside, so
# nothing that already worked stopped working.
[mgr]
prepend_keymap = [
    # ── Moving around (Dolphin) ──────────────────────────────────────────
    # Enter goes into a folder and opens a file, whichever is under the
    # cursor. Plain `open` on a folder handed it to xdg-open, which opened
    # Dolphin itself.
    { on = "<Enter>",     run = "plugin smart-enter",  desc = "Open the file or enter the folder" },
    { on = "<Backspace>", run = "leave",               desc = "Up to the parent folder" },
    { on = "<A-Up>",      run = "leave",               desc = "Up to the parent folder" },
    { on = "<A-Left>",    run = "back",                desc = "Back" },
    { on = "<A-Right>",   run = "forward",             desc = "Forward" },
    { on = "<A-Home>",    run = "cd ~",                desc = "Home folder" },
    { on = "<C-l>",       run = "cd --interactive",    desc = "Type a location" },
    { on = "<C-h>",       run = "hidden toggle",       desc = "Show or hide hidden files" },
    { on = "<A-.>",       run = "hidden toggle",       desc = "Show or hide hidden files" },

    # ── Places: g, then a letter (a list pops up after g) ────────────────
    { on = ["g", "h"], run = "cd ~",               desc = "Home" },
    { on = ["g", "e"], run = "cd ~/Escritorio",    desc = "Desktop" },
    { on = ["g", "D"], run = "cd ~/Documentos",    desc = "Documents" },
    { on = ["g", "d"], run = "cd ~/Downloads",     desc = "Downloads" },
    { on = ["g", "s"], run = "cd ~/Descargas",     desc = "Descargas (the browser's)" },
    { on = ["g", "p"], run = "cd ~/Pictures",      desc = "Pictures" },
    { on = ["g", "i"], run = "cd ~/Imágenes",      desc = "Imágenes" },
    { on = ["g", "m"], run = "cd ~/Música",        desc = "Music" },
    { on = ["g", "v"], run = "cd ~/Vídeos",        desc = "Videos" },
    { on = ["g", "j"], run = "cd ~/Games",         desc = "Games" },
    { on = ["g", "x"], run = "cd /mnt/ssd",        desc = "The SSD (/mnt/ssd)" },
    { on = ["g", "o"], run = "cd ~/obsidian",      desc = "Obsidian" },
    { on = ["g", "c"], run = "cd ~/.config",       desc = "Config folder" },
    { on = ["g", "r"], run = "cd /",               desc = "Root (/)" },
    { on = ["g", "t"], run = "plugin trash",       desc = "Trash" },

    # ── Selecting ────────────────────────────────────────────────────────
    # Ctrl+A was "invert" here; in Dolphin (and yazi's own default) it
    # selects everything. Invert moves to Ctrl+Shift+A, as in Dolphin.
    { on = "<C-a>",       run = "toggle_all --state=on",  desc = "Select all" },
    { on = "<C-A>",       run = "toggle_all",             desc = "Invert the selection" },

    # ── Files (Dolphin) ──────────────────────────────────────────────────
    # Ctrl+C was yazi's "close tab / quit"; it copies here, as everywhere
    # else. q (or Ctrl+Q) quits. Pasting over existing files stays on P:
    # Ctrl+Shift+V is kitty's paste, for typing names (kitty/yazi.conf).
    { on = "<C-c>",       run = "yank",                   desc = "Copy" },
    { on = "<C-x>",       run = "yank --cut",             desc = "Cut" },
    { on = "<C-v>",       run = "paste",                  desc = "Paste" },
    { on = "<Delete>",    run = "remove",                 desc = "Move to Trash" },
    { on = "<S-Delete>",  run = "remove --permanently",   desc = "Delete permanently" },
    { on = "<F2>",        run = "rename --cursor=before_ext", desc = "Rename (several at once opens an editor)" },
    { on = "<F10>",       run = "create --dir",           desc = "New folder" },
    { on = "<C-N>",       run = "create --dir",           desc = "New folder" },
    { on = "<C-n>",       run = "create",                 desc = "New file (end the name with / for a folder)" },
    { on = "<A-Enter>",   run = "spot",                   desc = "Properties of the file" },
    { on = "<C-q>",       run = "quit",                   desc = "Quit" },

    # ── Finding ──────────────────────────────────────────────────────────
    { on = "<C-f>",       run = "search --via=fd",        desc = "Search by name, in this folder and below" },
    { on = "<C-F>",       run = "search --via=rg",        desc = "Search inside files" },
    { on = "<C-i>",       run = "filter --smart",         desc = "Filter this folder as you type" },

    # ── Tabs (Dolphin) ───────────────────────────────────────────────────
    { on = "<C-t>",       run = "tab_create --current",   desc = "New tab" },
    { on = "<C-w>",       run = "close",                  desc = "Close the tab (the window, if it is the last)" },
    { on = "<C-Tab>",     run = "tab_switch 1 --relative",  desc = "Next tab" },
    { on = "<C-BackTab>", run = "tab_switch -1 --relative", desc = "Previous tab" },
    { on = "<C-S-BackTab>", run = "tab_switch -1 --relative", desc = "Previous tab" },
    { on = "<C-PageDown>", run = "tab_switch 1 --relative",  desc = "Next tab" },
    { on = "<C-PageUp>",   run = "tab_switch -1 --relative", desc = "Previous tab" },

    # ── Panels and views (Dolphin) ───────────────────────────────────────
    # Hidden at start (init.lua), as Dolphin shows the one folder; F9 brings
    # the parent column back, the nearest thing here to the Places panel.
    { on = "<F9>",        run = "plugin toggle-pane min-parent",  desc = "Show or hide the parent folder column" },
    { on = "<F11>",       run = "plugin toggle-pane min-preview", desc = "Show or hide the preview" },
    { on = "<S-F11>",     run = "plugin toggle-pane max-preview", desc = "Preview full width" },
    # yazi runs it in the folder on screen, so the terminal opens there.
    { on = "<F4>",        run = "shell --orphan -- kitty", desc = "Terminal here" },
    { on = "<C-1>",       run = ["sort natural --reverse=no", "linemode size_and_mtime"], desc = "Sort by name" },
    { on = "<C-2>",       run = ["sort size --reverse=yes", "linemode size_and_mtime"],   desc = "Sort by size, largest first" },
    { on = "<C-3>",       run = ["sort mtime --reverse=yes", "linemode size_and_mtime"],  desc = "Sort by date, newest first" },
    { on = "<C-4>",       run = ["sort extension --reverse=no", "linemode size_and_mtime"], desc = "Sort by type" },

    # ── Extras ───────────────────────────────────────────────────────────
    { on = "z",           run = "plugin zoxide",          desc = "Jump to a folder (zoxide)" },
    # Two keys, so the c-prefixed copy-path keys (cc path, cd folder path,
    # cf name) are not shadowed -- a bare `c` here swallowed all of them.
    { on = ["c", "z"],    run = "plugin compress",        desc = "Compress the selection" },
    # Extract here: what Enter does on an archive, for the whole selection
    # at once. Each goes into a folder named after it.
    { on = "e",           run = "shell -- ya pub extract --list %s", desc = "Extract here" },
    { on = "T",           run = "plugin chmod",           desc = "Change permissions" },
    { on = "M",           run = "plugin mount",           desc = "Manage disks and partitions" },
    { on = "F",           run = "plugin full-border",     desc = "Toggle the full border" },

    # The one thing a TUI cannot do by itself: hand a file to another app by
    # dragging it. ripdrag puts the selection in a small window that any
    # GTK/Qt app accepts a drop from. `--orphan` so yazi is not held while
    # that window is open.
    #
    # `%s` is yazi 26's placeholder for the selected paths. The older `"$@"`
    # form is not an error here -- it expands to nothing, and the command
    # runs on no files at all.
    { on = "<A-d>",       run = 'shell --orphan -- ripdrag -x -a %s', desc = "Drag the selection to another app" },
]
